<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#00356b"/>
      <stop offset="100%" stop-color="#001f3f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb76c"/>
      <stop offset="100%" stop-color="#b48c48"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Gold accent border -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#gold)" stroke-width="14" stroke-opacity="0.85"/>
  <!-- Elegant Monogram text SH -->
  <text x="256" y="325" 
        font-family="'Cormorant Garamond', 'Georgia', serif" 
        font-size="240" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#fcfaf7" 
        text-anchor="middle">SH</text>
  <!-- Small gold diamond accent under text -->
  <polygon points="256,365 264,375 256,385 248,375" fill="url(#gold)"/>
</svg>